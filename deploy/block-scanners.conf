# ── Block exploit/scanner paths (WordPress & misc) before they reach any upstream ──
# 444 = drop connection (no response) — best for dumb scanners; 403 for the rest.
location ~* ^/(wp-admin|wp-includes|wp-content|wp-json|wp-login\.php|xmlrpc\.php) { return 444; }
location ~* \.php(\.\d+)?$ { return 444; }
location ~* ^/(\.env|\.git|\.svn|\.hg|composer\.json|composer\.lock|shell\.php|adminer\.php) { return 444; }
location ~* (\.sql|\.bak|\.old|\.orig|\.swp|\.sh|\.pem|\.key)$ { return 444; }