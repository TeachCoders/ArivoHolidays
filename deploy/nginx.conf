# arivoholidays.com → Next.js (3000)
server {
    listen 80;
    listen [::]:80;
    server_name arivoholidays.com www.arivoholidays.com;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Serve public images (stored in Supabase Storage "public" bucket) via
    # the site's own domain for SEO/branding, proxied from Supabase CDN.
    location ~ ^/(content|india-tour|indai|india|spiritual|wildlife|taj-mahal|desert-safari|golden-triangle|heritage-and-culture|hill-station|honeymoon|ayurveda-yoga|quotations|3-days-delhit-agra-jaipur-tirp-golden-triangle)(/.*)?$ {
        proxy_pass https://khgopfgebkkdlnwwoanx.supabase.co/storage/v1/object/public/public$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host khgopfgebkkdlnwwoanx.supabase.co;
        proxy_cache_valid 200 30d;
    }
}

# api.arivoholidays.com → Express (5000)
server {
    listen 80;
    listen [::]:80;
    server_name api.arivoholidays.com;

    client_max_body_size 50m;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}